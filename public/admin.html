<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4f0"><title>Team submissions — FOMOless</title>
<style>
:root{--ink:#18241e;--muted:#68766d;--paper:#f5f4f0;--white:#fffefa;--line:#e5e5dd;--green:#174d39;--lime:#d4f278}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:980px;margin:auto;padding:0 22px}.nav{height:72px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:20px;letter-spacing:-.04em}.brand a{text-decoration:none;color:inherit}.wrap{padding:38px 0}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:800;color:#568069;margin:0 0 8px}h1{font-size:clamp(32px,6vw,50px);letter-spacing:-.06em;line-height:1;margin:0}.lead{color:var(--muted);margin:12px 0 24px}.panel,.submission{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:18px;margin:12px 0}.login{display:flex;gap:9px;max-width:540px}.login input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit}.button{height:42px;border:0;border-radius:9px;padding:0 15px;background:var(--green);color:white;font:inherit;font-weight:800;cursor:pointer}.button.secondary{background:white;color:var(--green);border:1px solid var(--line)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 10px}.toolbar h2{font-size:21px;letter-spacing:-.04em;margin:0}.meta,.quiet{color:var(--muted);font-size:13px}.idea{white-space:pre-wrap;margin:11px 0;color:#37453b}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}.detail{background:#f5f6f0;border-radius:9px;padding:10px}.detail small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.detail span{display:block;font-size:13px;margin-top:3px;overflow-wrap:anywhere}.error{color:#a53e35}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:560px){.shell{padding:0 15px}.login{flex-direction:column}.toolbar{align-items:flex-start}.details{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell"><header class="nav"><div class="brand"><a href="/">↗ FOMOless</a></div><a href="/" class="quiet">Back to app</a></header><main class="wrap"><p class="eyebrow">Private team view</p><h1>Idea submissions</h1><p class="lead">Only ideas and filter preferences submitted with consent are shown here. Names, emails, and IP addresses are not collected.</p><section class="panel" id="loginPanel"><label for="token"><strong>Admin access token</strong></label><p class="quiet">This is the ADMIN_TOKEN set in your app’s hosting settings. It stays in this tab only.</p><form class="login" id="loginForm"><input type="password" id="token" autocomplete="current-password" required placeholder="Enter admin token"><button class="button" type="submit">View submissions</button></form><p id="status" class="quiet" role="status"></p></section><section id="results" hidden><div class="toolbar"><div><h2>Recent ideas</h2><div id="meta" class="meta"></div></div><div><button id="refresh" class="button secondary">Refresh</button> <button id="export" class="button secondary">Download data</button> <button id="signOut" class="button secondary">Sign out</button></div></div><div id="submissions"></div></section></main></div>
<script>
const $=id=>document.getElementById(id);let rows=[];const tokenKey='fomoless-admin-token';
function textElement(tag,value,className){const el=document.createElement(tag);el.textContent=value||'';if(className)el.className=className;return el}
function render(){const root=$('submissions');root.replaceChildren();$('meta').textContent=`${rows.length} submission${rows.length===1?'':'s'} (up to the most recent 500)`;if(!rows.length){root.append(textElement('div','No submissions yet.','panel empty'));return}for(const item of rows){const card=document.createElement('article');card.className='submission';const head=document.createElement('div');head.className='meta';head.textContent=new Date(item.submittedAt).toLocaleString();card.append(head,textElement('p',item.idea,'idea'));const details=document.createElement('div');details.className='details';for(const [label,value] of Object.entries(item.preferences||{})){if(!value)continue;const box=document.createElement('div');box.className='detail';box.append(textElement('small',label),textElement('span',value));details.append(box)}card.append(details);if(item.analysis){card.append(textElement('h3','AI feedback'));card.append(textElement('p',item.analysis,'idea'))}root.append(card)}}
async function fetchRows(token){$('status').textContent='Loading…';$('status').className='quiet';try{const response=await fetch('/api/admin/submissions',{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not load submissions.');rows=data;sessionStorage.setItem(tokenKey,token);$('loginPanel').hidden=true;$('results').hidden=false;render()}catch(error){$('status').textContent=error.message;$('status').className='error'}}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();fetchRows($('token').value.trim())});$('refresh').addEventListener('click',()=>fetchRows(sessionStorage.getItem(tokenKey)||''));$('signOut').addEventListener('click',()=>{sessionStorage.removeItem(tokenKey);rows=[];$('results').hidden=true;$('loginPanel').hidden=false;$('token').value=''});$('export').addEventListener('click',()=>{const file=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(file);link.download=`fomoless-submissions-${new Date().toISOString().slice(0,10)}.json`;link.click();URL.revokeObjectURL(link.href)});const existing=sessionStorage.getItem(tokenKey);if(existing)fetchRows(existing);
</script></body></html>
